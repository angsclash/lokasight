<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Lokasight</title>

  <link rel="stylesheet" href="css/login.css" />
  <script src="js/offline-icons.js" defer></script>
</head>

<body>
  <div class="login-page">

    <img src="assets/img/logo4.png" alt="" class="login-bg-icon bg-icon-1" />
    <img src="assets/img/logo4.png" alt="" class="login-bg-icon bg-icon-2" />
    <img src="assets/img/logo4.png" alt="" class="login-bg-icon bg-icon-3" />
    <img src="assets/img/logo4.png" alt="" class="login-bg-icon bg-icon-4" />

    <div class="login-card">
      <div class="brand">
        <img
          src="assets/img/logo5.png"
          alt="Logo Lokasight"
          class="brand-logo-full"
        />
    
      </div>

      <div class="welcome">
        <h1>Selamat Datang di Lokasight</h1>
        <p>Dashboard Monitoring Hama dan Penyakit Selada</p>
      </div>

      <form id="loginForm" class="login-form">
        <div class="form-group">
          <label for="username">Username</label>
          <input
            id="username"
            type="text"
            placeholder="Masukan username"
            autocomplete="username"
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            id="password"
            type="password"
            placeholder="Masukan password"
            autocomplete="current-password"
          />
        </div>

        <p id="loginError" class="login-error hidden"></p>

        <button id="loginBtn" type="submit">
          Login
        </button>
      </form>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/login.js" defer></script>
</body>
</html>
